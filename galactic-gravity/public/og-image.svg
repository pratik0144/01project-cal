<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3C9EFF"/>
      <stop offset="100%" stop-color="#6BB8FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/><line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/><line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/><line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="63" x2="1200" y2="63"/><line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="189" x2="1200" y2="189"/><line x1="0" y1="252" x2="1200" y2="252"/><line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="441" x2="1200" y2="441"/><line x1="0" y1="504" x2="1200" y2="504"/><line x1="0" y1="567" x2="1200" y2="567"/><line x1="0" y1="630" x2="1200" y2="630"/>
  </g>

  <!-- Glow circle behind clock -->
  <circle cx="600" cy="210" r="120" fill="#3C9EFF" opacity="0.06"/>
  <circle cx="600" cy="210" r="80" fill="#3C9EFF" opacity="0.04"/>

  <!-- Clock icon -->
  <g transform="translate(600, 210)">
    <circle cx="0" cy="0" r="56" stroke="#3C9EFF" stroke-width="5" fill="none" opacity="0.9"/>
    <!-- Hour marks -->
    <line x1="0" y1="-48" x2="0" y2="-42" stroke="#3C9EFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="-41.5" x2="21" y2="-36.4" stroke="#3C9EFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="41.5" y1="-24" x2="36.4" y2="-21" stroke="#3C9EFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="48" y1="0" x2="42" y2="0" stroke="#3C9EFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="41.5" y1="24" x2="36.4" y2="21" stroke="#3C9EFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="41.5" x2="21" y2="36.4" stroke="#3C9EFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="48" x2="0" y2="42" stroke="#3C9EFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="-24" y1="41.5" x2="-21" y2="36.4" stroke="#3C9EFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="-41.5" y1="24" x2="-36.4" y2="21" stroke="#3C9EFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="-48" y1="0" x2="-42" y2="0" stroke="#3C9EFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="-41.5" y1="-24" x2="-36.4" y2="-21" stroke="#3C9EFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="-24" y1="-41.5" x2="-21" y2="-36.4" stroke="#3C9EFF" stroke-width="2" stroke-linecap="round"/>
    <!-- Clock hands -->
    <line x1="0" y1="4" x2="0" y2="-30" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="4" x2="22" y2="11" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="4" fill="#3C9EFF"/>
  </g>

  <!-- "Online" text -->
  <text x="600" y="330" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="50" font-weight="700" fill="#ffffff" letter-spacing="-1.5">
    Online<tspan fill="#3C9EFF">Overtime</tspan>Calculator
  </text>

  <!-- Tagline -->
  <text x="600" y="380" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#a0a0a0" letter-spacing="0.5">
    Calculate OT Pay for All 50 U.S. States • Free • Instant Results
  </text>

  <!-- Feature pills -->
  <g transform="translate(600, 430)">
    <!-- 1.5× / 2× pill -->
    <rect x="-260" y="-18" width="120" height="36" rx="18" fill="#3C9EFF" opacity="0.12"/>
    <text x="-200" y="6" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" font-weight="600" fill="#3C9EFF">1.5× &amp; 2× Pay</text>
    <!-- State-specific pill -->
    <rect x="-100" y="-18" width="200" height="36" rx="18" fill="#3C9EFF" opacity="0.12"/>
    <text x="0" y="6" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" font-weight="600" fill="#3C9EFF">State-Specific Rules</text>
    <!-- Updated 2026 pill -->
    <rect x="140" y="-18" width="120" height="36" rx="18" fill="#3C9EFF" opacity="0.12"/>
    <text x="200" y="6" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" font-weight="600" fill="#3C9EFF">2026 Rules</text>
  </g>

  <!-- Bottom URL bar -->
  <rect x="0" y="570" width="1200" height="60" fill="#0a0a0a" opacity="0.6"/>
  <text x="600" y="607" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="500" fill="#666666" letter-spacing="2">
    ONLINEOVERTIMECALCULATOR.COM
  </text>
</svg>
